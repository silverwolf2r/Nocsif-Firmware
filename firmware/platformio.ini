; PlatformIO build config for the NocSif firmware, using the ESP-IDF framework directly.

[env:nocsif-twatch-ultra]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1          ; stand-in devkit board; actual hardware pinout differs
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

; Device exposes a native USB-Serial/JTAG console rather than a UART bridge.
monitor_speed = 115200

build_flags =
    -DNOCSIF_VERSION=\"0.0.1-ota\"
    ; wifi.c overrides ieee80211_raw_frame_sanity_check(), which IDF now defines as a
    ; strong symbol; keep the app's definition instead of failing the link on the clash.
    -Wl,--allow-multiple-definition
    ; SD bounce-crash fix (src/sd_bounce.c): route every heap_caps_aligned_alloc() / free() in the image
    ; through __wrap_* so spi_master's per-transfer DMA bounce buffers for the SD transaction in flight
    ; come from a tiny static pool instead of the BLE+WiFi-starved int-DMA heap (whose failure IDF turns
    ; into a memcpy-from-NULL panic). Both wraps are one predictable branch on the hot path.
    -Wl,--wrap=heap_caps_aligned_alloc
    -Wl,--wrap=free
