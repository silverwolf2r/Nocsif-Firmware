; PlatformIO build config for the NocSif firmware, using the ESP-IDF framework directly.

[env:nocsif-twatch-ultra]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1          ; stand-in devkit board; actual hardware pinout differs
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

; Device exposes a native USB-Serial/JTAG console rather than a UART bridge.
monitor_speed = 115200

build_flags =
    -DNOCSIF_VERSION=\"0.0.1-ota\"
    ; wifi.c overrides ieee80211_raw_frame_sanity_check(), which IDF now defines as a
    ; strong symbol; keep the app's definition instead of failing the link on the clash.
    -Wl,--allow-multiple-definition
