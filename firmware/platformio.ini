; NocSif firmware — PlatformIO / ESP-IDF (native core, Option B)
; M0: boot + PSRAM confirm + serial console over USB-Serial/JTAG.
; PlatformIO fetches the ESP-IDF toolchain on first build (several minutes).

[env:nocsif-twatch-ultra]
platform = espressif32
framework = espidf
board = esp32-s3-devkitc-1          ; generic S3 base; the Ultra is a custom board (pins come later)
board_build.mcu = esp32s3
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

; The Ultra talks over the ESP32-S3 native USB-Serial/JTAG (COM7), not a UART bridge.
monitor_speed = 115200

build_flags =
    -DNOCSIF_VERSION=\"0.0.1-ota\"
    ; M5-P5·1: our ieee80211_raw_frame_sanity_check() override (wifi.c) enables raw management-frame
    ; TX for authorized testing. IDF 5.5.4 defines that symbol strong (it was weak before), so the
    ; app override collides at link; take the first (app) definition instead of erroring.
    -Wl,--allow-multiple-definition
