# Managed dependencies for the app component, resolved by the ESP-IDF component
# manager during CMake configure and downloaded into managed_components/.
dependencies:
  idf: ">=5.4"
  # esp_lcd panel driver for the CO5300 QSPI AMOLED controller.
  espressif/esp_lcd_co5300: "^2.1.0"
  # LVGL <-> esp_lcd integration layer (owns the tick/task/mutex/flush glue).
  espressif/esp_lvgl_port: "^2"
  # Pin LVGL to the 9.3.x line explicitly, since esp_lvgl_port only constrains it to
  # ">=8,<10" and the solver could otherwise pick an incompatible v8 or v9.x release.
  lvgl/lvgl: "~9.3.0"
  # TinyUSB device stack (composite CDC/MSC/HID). Pinned to the v2 major, which is a
  # breaking redesign versus v1.x; pulls in the espressif/tinyusb port transitively.
  espressif/esp_tinyusb: "^2"
  # mDNS responder so the device resolves at nocsif.local; pinned to the 1.x major.
  espressif/mdns: "^1"
  # §4.8a Companion mirror — software JPEG encoder (no HW JPEG on the S3). The live
  # screen mirror is JPEG-compressed before it goes over the SoftAP WebSocket: a raw
  # 205×251 RGB565 frame is ~103 KB (the bandwidth wall that made the mirror laggy);
  # JPEG drops it ~10× so the link keeps up and the mirror stays responsive.
  espressif/esp_new_jpeg: "^1"
