# NocSif DNS-transport fallback (requirement 5).
# Path on the card: /sd/nocsif/dnstunnel/dnstunnel.conf
# Format: key=value, one per line. '#' starts a comment.
#
# FEASIBILITY: there is no drop-in ESP-IDF iodine/dnstt client. The module PARSES this config and
# reports state ("experimental" / "no config"); the packet codec + custom lwIP netif are gated behind
# CONFIG_NOCSIF_GW_DNST_EXPERIMENTAL and are the operator-server-specific piece (see the design note).
# For an uplink that merely FORWARDS UDP/53, prefer WireGuard on tunnel_port=53 instead (requirement 3).

# The authoritative domain delegated to your DNS-tunnel server (dnstt/iodine style):
server=t.tunnel.example.net
# Shared key / server public key that authenticates the session (base64 or hex, per your server):
key=REPLACE_WITH_SHARED_KEY
# Tunnel MTU (bytes). Smaller = more DNS overhead but survives stricter resolvers.
mtu=1200
