# NocSif WireGuard tunnel (requirement 3).
# Path on the card: /sd/nocsif/wireguard/wg0.conf
# Standard wg-quick INI. The forwarded (downstream) traffic egresses through this tunnel once it is
# up (the wg interface becomes the default route). Parsed keys are listed below; other wg-quick keys
# are ignored. Missing/incomplete file => the tunnel stays off with status "no config".

[Interface]
# This device's tunnel private key (base64, from `wg genkey`).
PrivateKey = QMx6a0k8m2n...=REPLACE_WITH_YOUR_PRIVATE_KEY=
# This device's address inside the tunnel (the /mask is ignored; host address is used).
Address = 10.9.0.2/32
# Optional: resolver to hand downstream clients / use upstream while tunnelled.
DNS = 10.9.0.1
# ListenPort is optional (ephemeral if omitted).

[Peer]
# The server's public key (base64).
PublicKey = 9SxL2f...=REPLACE_WITH_PEER_PUBLIC_KEY=
# Optional pre-shared key (base64) for an extra symmetric layer.
# PresharedKey = k7...=OPTIONAL=
# Server endpoint. The PORT here is the tunnel port — set it to 53 or 67 for uplinks that only pass
# those ports (a matching server must listen there). gateway.conf's tunnel_port overrides this.
Endpoint = vpn.example.net:51820
# Route ALL forwarded traffic through the tunnel. Only the first CIDR is used.
AllowedIPs = 0.0.0.0/0
# Keep the NAT mapping alive through the uplink.
PersistentKeepalive = 25
