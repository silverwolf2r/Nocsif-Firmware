# NocSif network gateway — SoftAP + master options.
# Path on the card: /sd/nocsif/gateway/gateway.conf
# Format: key=value, one per line. '#' or ';' starts a comment. Missing file => defaults below.

# ---- downstream SoftAP (requirement 1) ----
ap_ssid=NocSif-Gateway        # SSID clients join
ap_pass=changeme12345         # >=8 chars => WPA2-PSK; empty/short => OPEN AP
ap_channel=0                  # 0 = follow the STA uplink channel (required on a single radio)
ap_hidden=0                   # 1 = do not beacon the SSID
ap_maxconn=4                  # 1..8 simultaneous clients

# ---- DNS filter (requirement 2) ----
# Upstream resolver for names that are NOT blocked. Empty => use the STA's DHCP-provided DNS,
# then 1.1.1.1 as a last resort. When the tunnel is up you may point this at the tunnel's DNS.
dns_upstream=

# ---- sign-in portal (requirement 4) ----
# HTML file under /sd/nocsif/portals/ to serve as the splash. Empty => built-in notice page.
portal_page=signin.html

# ---- WireGuard tunnel (requirement 3) ----
# Override the tunnel's UDP port regardless of the Endpoint port in wg0.conf. Use for uplinks that
# only pass certain ports (e.g. 53 or 67). 0 = use the port from wg0.conf's Endpoint.
tunnel_port=0
